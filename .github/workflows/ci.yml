name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.tests.outputs.linux }}
      macos: ${{ steps.tests.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
      - id: tests
        run: python3 scripts/ci_matrix.py >> "$GITHUB_OUTPUT"

  build-linux:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: true
      - run: zig build -Dcpu=baseline
      - uses: actions/upload-artifact@v4
        with:
          name: nib-ubuntu-latest
          path: zig-out/bin/nib

  build-macos:
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: true
      - run: zig build -Dcpu=baseline
      - uses: actions/upload-artifact@v4
        with:
          name: nib-macos-latest
          path: zig-out/bin/nib

  unit:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: true
      - run: zig build test --summary all
      - run: zig build test-bench-scheduler -Doptimize=ReleaseFast --summary all
      - run: python3 tests/test_bench_scheduler.py

  e2e-linux:
    needs: [list, build-linux]
    uses: ./.github/workflows/e2e.yml
    with:
      os: ubuntu-latest
      matrix: ${{ needs.list.outputs.linux }}

  e2e-macos:
    needs: [list, build-macos]
    uses: ./.github/workflows/e2e.yml
    with:
      os: macos-latest
      matrix: ${{ needs.list.outputs.macos }}
