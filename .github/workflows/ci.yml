name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Test development and CI tooling
        run: |
          python3 tests/test_release_metadata.py
          python3 tests/test_dev_install.py
      - name: Classify release metadata
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mode=full
          if [[ $EVENT == pull_request ]]; then
            mode=$(python3 scripts/ci_release_metadata.py "$BASE" "$HEAD" "$GITHUB_SHA")
          fi
          echo "Validation mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  list:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'metadata' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.tests.outputs.linux }}
      macos: ${{ steps.tests.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
      - id: tests
        run: python3 scripts/ci_matrix.py >> "$GITHUB_OUTPUT"

  build-linux:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'metadata' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: true
      - run: zig build -Dcpu=baseline
      - uses: actions/upload-artifact@v4
        with:
          name: nib-ubuntu-latest
          path: zig-out/bin/nib

  build-macos:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'metadata' }}
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: true
      - run: zig build -Dcpu=baseline
      - uses: actions/upload-artifact@v4
        with:
          name: nib-macos-latest
          path: zig-out/bin/nib

  unit:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'metadata' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: true
      - run: zig build test --summary all
      - run: zig build test-bench-scheduler -Doptimize=ReleaseFast --summary all
      - run: python3 tests/test_bench_scheduler.py

  e2e-linux:
    needs: [list, build-linux]
    uses: ./.github/workflows/e2e.yml
    with:
      os: ubuntu-latest
      matrix: ${{ needs.list.outputs.linux }}

  e2e-macos:
    needs: [list, build-macos]
    uses: ./.github/workflows/e2e.yml
    with:
      os: macos-latest
      matrix: ${{ needs.list.outputs.macos }}

  gate:
    name: CI gate
    needs: [plan, list, build-linux, build-macos, unit, e2e-linux, e2e-macos]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected validation to pass
        shell: bash
        env:
          PLAN: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          LIST: ${{ needs.list.result }}
          BUILD_LINUX: ${{ needs.build-linux.result }}
          BUILD_MACOS: ${{ needs.build-macos.result }}
          UNIT: ${{ needs.unit.result }}
          E2E_LINUX: ${{ needs.e2e-linux.result }}
          E2E_MACOS: ${{ needs.e2e-macos.result }}
        run: |
          echo "Plan=$PLAN mode=$MODE list=$LIST build-linux=$BUILD_LINUX build-macos=$BUILD_MACOS unit=$UNIT e2e-linux=$E2E_LINUX e2e-macos=$E2E_MACOS"
          [[ $PLAN == success ]]
          case $MODE in
            metadata) expected=skipped ;;
            full) expected=success ;;
            *) exit 1 ;;
          esac
          for result in "$LIST" "$BUILD_LINUX" "$BUILD_MACOS" "$UNIT" "$E2E_LINUX" "$E2E_MACOS"; do
            [[ $result == "$expected" ]] || exit 1
          done
